name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: kakao_novel_downloader
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r kakao_novel_downloader/requirements-dev.txt
      - run: python -m unittest discover -s kakao_novel_downloader/tests -v
